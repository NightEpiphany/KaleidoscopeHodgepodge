plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = providers.gradleProperty("archives_base_name")
}

repositories {
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
    maven {
        // location of the maven that hosts JEI files since January 2023
        // Patchouli
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
	maven {
		name = "Fuzs Mod Resources"
		url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
	}
	maven {
		url "https://cursemaven.com"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation("mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}")
	modImplementation "maven.modrinth:kaleidoscope-cookery-refabricated:${project.kaleidoscope_cookery_version}-fabric+mc${project.minecraft_version}"
	def integrationScope = project.hasProperty('minimalRuntime') ? 'modCompileOnly' : 'modImplementation'
	add(integrationScope, "maven.modrinth:kaleidoscope-tavern-refabricated:${project.kaleidoscope_tavern_version}-fabric+mc${project.minecraft_version}")
	add(integrationScope, "curse.maven:kaleidoscopechinesefood-refabricated-1674961:9030609")
	add(integrationScope, "curse.maven:kaleidoscope-world-liquor-refabricated-1693193:8956447")
	// Required at runtime by Chinese Food and World Liquor's doll registrations.
	if (!project.hasProperty('minimalRuntime')) modRuntimeOnly "maven.modrinth:kaleidoscope-doll:4oeiQyIt"
	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_api_version}"
}

loom {
	runs {
		if (project.hasProperty('clientSmoke')) {
			client {
				runDir = project.hasProperty('minimalRuntime') ? 'build/client-smoke-minimal' : 'build/client-smoke'
				programArgs '--width', '1280', '--height', '960'
				vmArg "-Dhodgepodge.testExample=${projectDir}/example_code.txt"
			}
		}
		gameTestServer {
			server()
			name = "Game Test Server"
			runDir = "build/gametest"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dhodgepodge.testExample=${projectDir}/example_code.txt"
		}
	}
}

// The visual smoke runner is opt-in and is never included in ordinary builds.
if (project.hasProperty('clientSmoke')) {
	sourceSets.main.java.srcDir('src/clientSmoke/java')
}

processResources {
	def version = project.version
	inputs.property "version", version
	inputs.property 'clientSmoke', project.hasProperty('clientSmoke')

	filesMatching("fabric.mod.json") {
		expand "version": version
		if (project.hasProperty('clientSmoke')) {
			filter { line -> line.replace('"com.moigferdsrte.kaleidoscopehodgepodge.KaleidoscopeHodgepodgeClient"',
					'"com.moigferdsrte.kaleidoscopehodgepodge.KaleidoscopeHodgepodgeClient", "com.moigferdsrte.kaleidoscopehodgepodge.smoketest.ClientSmoke"') }
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(25)
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaExec).configureEach {
	javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
